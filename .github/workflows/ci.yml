name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: shell_parse test suite
        run: ./scripts/tests/shell_parse
      - name: manifest_check test suite
        run: ./scripts/tests/manifest_check
      - name: yaml_parse test suite
        run: ./scripts/tests/yaml_parse
      - name: go_test test suite
        run: ./scripts/tests/go_test

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
